<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" viewBox="0 0 1222 285" width="1222" height="285" role="img" aria-labelledby="arch-deploy-t arch-deploy-d"><title id="arch-deploy-t">GitHub to Vercel deployment pipeline</title><desc id="arch-deploy-d">A git push to GitHub triggers Vercel, which installs dependencies, runs migrate, ensure_superuser and collectstatic, then serves Django as a serverless WSGI app backed by MySQL.</desc><style>
