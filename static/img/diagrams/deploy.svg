</style><defs><marker id="arch-deploy-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker><marker id="arch-deploy-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah ah--a"/></marker></defs><rect class="bg" x="0" y="0" width="1222" height="285" rx="10"/><rect x="24.0" y="34.0" width="182" height="105.0" rx="7" class="n"/><text x="36.0" y="60.0" class="t1">Developer</text><text x="36.0" y="77.0" class="t2">git push origin main</text><text x="36.0" y="91.5" class="t2">migration files committed</text><rect x="272.0" y="34.0" width="182" height="105.0" rx="7" class="n n--a"/><text x="284.0" y="60.0" class="t1">GitHub</text><text x="284.0" y="77.0" class="t2">repository · main branch</text><text x="284.0" y="91.5" class="t2">push triggers a Vercel</text><text x="284.0" y="106.0" class="t2">build</text><rect x="520.0" y="34.0" width="182" height="105.0" rx="7" class="n"/><text x="532.0" y="60.0" class="t1">Vercel build</text><text x="532.0" y="77.0" class="t2">detects Django</text><text x="532.0" y="91.5" class="t2">(manage.py)</text><text x="532.0" y="106.0" class="t2">pip install</text><text x="532.0" y="120.5" class="t2">requirements.txt</text><rect x="768.0" y="34.0" width="182" height="105.0" rx="7" class="n n--a"/><text x="780.0" y="60.0" class="t1">Build command</text><text x="780.0" y="77.0" class="t2">migrate --noinput</text><text x="780.0" y="91.5" class="t2">ensure_superuser</text><text x="780.0" y="106.0" class="t2">collectstatic --noinput</text><text x="780.0" y="120.5" class="t2">--clear</text><rect x="1016.0" y="34.0" width="182" height="105.0" rx="7" class="n n--s"/><text x="1028.0" y="60.0" class="t1">Serverless runtime</text><text x="1028.0" y="77.0" class="t2">portfolio_project.wsgi</text><text x="1028.0" y="91.5" class="t2">IS_VERCEL: signed-cookie</text><text x="1028.0" y="106.0" class="t2">sessions</text><path d="M206.0 86.5 L272.0 86.5" class="ln" marker-end="url(#arch-deploy-ah)"/><rect x="222.2" y="78.5" width="33.6" height="15" rx="3" class="lbl-bg"/><text x="239.0" y="89.5" class="t3" text-anchor="middle">push</text><path d="M454.0 86.5 L520.0 86.5" class="ln ln--a" marker-end="url(#arch-deploy-aha)"/><rect x="461.4" y="78.5" width="51.3" height="15" rx="3" class="lbl-bg"/><text x="487.0" y="89.5" class="t3" text-anchor="middle">webhook</text><path d="M702.0 86.5 L768.0 86.5" class="ln" marker-end="url(#arch-deploy-ah)"/><rect x="715.2" y="78.5" width="39.5" height="15" rx="3" class="lbl-bg"/><text x="735.0" y="89.5" class="t3" text-anchor="middle">build</text><path d="M950.0 86.5 L1016.0 86.5" class="ln ln--a" marker-end="url(#arch-deploy-aha)"/><rect x="960.3" y="78.5" width="45.4" height="15" rx="3" class="lbl-bg"/><text x="983.0" y="89.5" class="t3" text-anchor="middle">deploy</text><rect x="956.0" y="185.0" width="222" height="76.0" rx="7" class="n n--s"/><text x="968.0" y="211.0" class="t1">MySQL · DATABASE_URL</text><text x="968.0" y="228.0" class="t2">PyMySQL · ssl-mode=REQUIRED</text><text x="968.0" y="242.5" class="t2">admin edits persist here</text><path d="M859.0 139.0 L859.0 223.0 L956.0 223.0" class="ln ln--a ln--d" marker-end="url(#arch-deploy-aha)"/><rect x="833.4" y="173.0" width="51.3" height="15" rx="3" class="lbl-bg"/><text x="859.0" y="184.0" class="t3" text-anchor="middle">migrate</text><path d="M1097.0 139.0 L1097.0 185.0" class="ln" marker-end="url(#arch-deploy-ah)" marker-start="url(#arch-deploy-ah)"/><rect x="1050.7" y="154.0" width="92.6" height="15" rx="3" class="lbl-bg"/><text x="1097.0" y="165.0" class="t3" text-anchor="middle">reads / writes</text></svg>